version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet-platform:
        patterns: ['Microsoft.*', 'System.*']
      # Released together; mixed versions pull in a newer core library than the other packages expect.
      opentelemetry:
        patterns: ['OpenTelemetry*']
    ignore:
      # PulseWatch targets .NET 10 (LTS). Major platform versions (11.x) come with a planned upgrade of the
      # SDK, runtime images and EF Core, not as a package bump. Patch and minor updates still arrive.
      - dependency-name: 'Microsoft.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'System.*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # Type definitions must match the Node.js major we run (24, see Dockerfile and CI).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Base images in Dockerfile (.NET SDK/runtime, Node) and the images in the compose files.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
