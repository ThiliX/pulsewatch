name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PulseWatch.slnx

      - name: Check formatting
        run: dotnet format PulseWatch.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build PulseWatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution PulseWatch.slnx --configuration Release --no-build

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Builds every production target so a broken Dockerfile is caught before release. Nothing is pushed.
      - name: Build api, worker and migrations images
        run: |
          docker build --target api -t pulsewatch-api:ci .
          docker build --target worker -t pulsewatch-worker:ci .
          docker build --target migrations -t pulsewatch-migrations:ci .

      - name: Check the compose file
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod.example config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
