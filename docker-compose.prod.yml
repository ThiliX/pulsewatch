# Production deployment on a single Linux VM. Full guide: docs/deployment.md
#
#   cp .env.prod.example .env      # then fill in every value
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml run --rm migrate
#   docker compose -f docker-compose.prod.yml up -d
#
# Networks:
#   edge     Caddy <-> API. The only network with published ports (80/443, on Caddy).
#   backend  API, worker <-> PostgreSQL. Internal: no internet access at all.
#   egress   Worker only. Its way out to monitored sites and SMTP; firewall it (docs/deployment.md §6).

name: pulsewatch-prod

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

# Kerberos (GSS) encryption is off: the database is on a private Docker network, and the slim images
# do not ship the Kerberos library (Npgsql would log "Cannot load library libgssapi_krb5" otherwise).
x-database-connection: &database-connection
  ConnectionStrings__PulseWatch: Host=db;Port=5432;Database=${POSTGRES_DB:-pulsewatch};Username=${POSTGRES_USER:-pulsewatch};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Gss Encryption Mode=Disable

services:
  caddy:
    <<: *hardened
    image: caddy:2.11.8-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      PULSEWATCH_DOMAIN: ${PULSEWATCH_DOMAIN:?Set PULSEWATCH_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    depends_on:
      - api

  api:
    <<: *hardened
    build:
      context: .
      target: api
    image: pulsewatch-api:${PULSEWATCH_VERSION:-local}
    environment:
      <<: *database-connection
      ASPNETCORE_ENVIRONMENT: Production
      # Public HTTPS port, for redirecting any plain-http request that didn't come through Caddy.
      ASPNETCORE_HTTPS_PORT: ${HTTPS_PORT:-443}
      # Trust X-Forwarded-For/Proto from Caddy only.
      ReverseProxy__KnownNetworks__0: ${EDGE_SUBNET:-172.30.10.0/24}
      DataProtection__KeysPath: /keys
      # Closed by default: register your own account first (docs/deployment.md §4), then set it back to false.
      Registration__Enabled: ${REGISTRATION_ENABLED:-false}
      Monitoring__MaxMonitorsPerUser: ${MAX_MONITORS_PER_USER:-20}
      Telemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-}
    volumes:
      - dataprotection-keys:/keys
    networks:
      - edge
      - backend
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *hardened
    build:
      context: .
      target: worker
    image: pulsewatch-worker:${PULSEWATCH_VERSION:-local}
    environment:
      <<: *database-connection
      DOTNET_ENVIRONMENT: Production
      Monitoring__MaxMonitorsPerUser: ${MAX_MONITORS_PER_USER:-20}
      Notifications__Provider: ${EMAIL_PROVIDER:-Smtp}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseStartTls: ${SMTP_STARTTLS:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${EMAIL_FROM:-}
      App__PublicBaseUrl: https://${PULSEWATCH_DOMAIN}
      Telemetry__OtlpEndpoint: ${OTLP_ENDPOINT:-}
    networks:
      - backend
      - egress
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pulsewatch-db:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # One-off: applies database migrations, then exits. Run before starting a new release.
  migrate:
    <<: *hardened
    restart: "no"
    profiles: ["tools"]
    build:
      context: .
      target: migrations
    image: pulsewatch-migrations:${PULSEWATCH_VERSION:-local}
    environment:
      <<: *database-connection
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.10.0/24}
  backend:
    internal: true
  egress:
    driver_opts:
      # A fixed bridge name, so the firewall rules in docs/deployment.md can match it.
      com.docker.network.bridge.name: pw-egress
    ipam:
      config:
        - subnet: ${EGRESS_SUBNET:-172.30.20.0/24}

volumes:
  pulsewatch-db:
  dataprotection-keys:
  caddy-data:
  caddy-config:
